<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Reader — 境相阅读 · A warm Markdown reader & writer</title>
<meta name="description" content="Local-first Markdown reader & writer. 20 themes, native Word export, direct file read/write. No server, no uploads.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5; --bg-alt:#f5f0ea; --primary:#8b5e3c; --primary-light:#b8845a;
    --primary-dim:#a07456; --text-dark:#3d3327; --text-muted:#7a6b5d; --card:#fdfbf8;
    --border:#e0d6c8; --border-light:#ede5d8;
    --night-bg:#252019; --night-deep:#1c1814; --night-text:#e8ddd0; --night-muted:#b0a395;
    --accent-green:#5a7a4e; --accent-blue:#4a6a8a;
    --radius:16px; --radius-sm:10px; --shadow:0 12px 40px rgba(60,50,35,.06);
    --shadow-lg:0 20px 60px rgba(60,50,35,.10);
    --serif:"Noto Serif SC",Georgia,serif; --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);background:var(--bg);color:var(--text-dark);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1440px;margin:0 auto;padding:0 120px}
  a{text-decoration:none;color:inherit}
  button{font-family:var(--sans)}

  /* ---------- Nav ---------- */
  nav{position:sticky;top:0;z-index:50;background:rgba(250,248,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:80px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#b8845a,#8b5e3c);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand .name{font-weight:600;font-size:20px;color:var(--text-dark)}
  .nav-links{display:flex;align-items:center;gap:32px}
  .nav-links a{font-size:15px;font-weight:500;color:var(--text-muted);transition:color .2s}
  .nav-links a:hover{color:var(--primary)}
  .nav-login{color:var(--primary)!important;font-weight:600}
  .lang-switch{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;font-size:13px;font-weight:600}
  .lang-switch button{border:none;background:transparent;padding:6px 12px;cursor:pointer;color:var(--text-muted);font-family:var(--sans)}
  .lang-switch button.active{background:var(--primary);color:#fff}
  .btn-install{background:var(--primary);color:#fff;border:none;border-radius:8px;height:40px;padding:0 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:opacity .2s}
  .btn-install:hover{opacity:.9}

  /* ---------- Hero ---------- */
  .hero{padding:120px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px}
  .eyebrow{font-size:14px;font-weight:500;letter-spacing:.08em;color:var(--primary);margin-top:8px}
  .hero h1{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1.15;color:var(--text-dark);max-width:960px}
  .hero .sub{font-size:20px;color:var(--text-muted);max-width:760px;white-space:pre-line}
  .cta-row{display:flex;gap:16px;margin-top:8px}
  .btn-primary{background:var(--primary);color:#fff;border:none;border-radius:12px;height:52px;padding:0 32px;font-size:16px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:opacity .2s}
  .btn-primary:hover{opacity:.9}
  .btn-ghost{background:#f5ebe0;color:var(--primary);border:none;border-radius:12px;height:52px;padding:0 32px;font-size:16px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:background .2s}
  .btn-ghost:hover{background:#efe2d3}
  .reader-mock{width:880px;max-width:100%;height:380px;background:#fff;border:1px solid var(--border);border-radius:20px;display:flex;overflow:hidden;box-shadow:var(--shadow-lg);margin-top:16px;margin-bottom:48px}
  .reader-mock .sidebar{width:210px;background:#f5f0ea;padding:20px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--border)}
  .reader-mock .sidebar .sb-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
  .reader-mock .file{height:30px;border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:8px}
  .reader-mock .file .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .reader-mock .file.a{background:#e8ddc9}
  .reader-mock .file.a .dot{background:var(--primary)}
  .reader-mock .file.b,.reader-mock .file.c{background:#efe8df}
  .reader-mock .file.b .dot{background:var(--primary-light)}
  .reader-mock .file.c .dot{background:var(--accent-green)}
  .reader-mock .file span.lbl{height:8px;background:var(--text-muted);border-radius:2px;flex:1;opacity:.5}
  .reader-mock .file.a span.lbl{opacity:.7}
  .reader-mock .content{flex:1;background:#fdfbf8;padding:32px 40px;display:flex;flex-direction:column;gap:14px}
  .reader-mock .h1{width:220px;height:28px;background:var(--text-dark);border-radius:4px}
  .reader-mock .p{height:10px;background:var(--text-muted);border-radius:2px;opacity:.55}
  .reader-mock .p.short{width:280px}
  .reader-mock .p.mid{width:420px}
  .reader-mock .quote{height:72px;background:#f5f0ea;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .reader-mock .quote span{height:8px;background:var(--primary-light);border-radius:2px;width:100%;opacity:.6}
  .reader-mock .quote span.s{width:200px}
  .reader-mock .code{height:40px;background:#f0ead8;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 12px}
  .reader-mock .code .ln{width:12px;height:8px;background:var(--primary);border-radius:1px;opacity:.4}
  .reader-mock .code .ln:nth-child(2){width:60px;opacity:.6}
  .reader-mock .code .ln:nth-child(3){width:40px;opacity:.5}

  /* ---------- Diff banner ---------- */
  .diff{background:var(--bg-alt);padding:48px 0}
  .diff-grid{display:grid;grid-template-columns:repeat(4,1fr)}
  .diff-item{padding:0 24px;display:flex;flex-direction:column;gap:10px}
  .diff-item + .diff-item{border-left:1px solid var(--border)}
  .diff-ico{width:48px;height:48px;border-radius:12px;background:#f5ebe0;display:flex;align-items:center;justify-content:center}
  .diff-item h3{font-size:18px;font-weight:600;color:var(--text-dark)}
  .diff-item p{font-size:14px;color:var(--text-muted)}

  /* ---------- Section shells ---------- */
  section.block{padding:120px 0}
  .block.alt{background:var(--bg-alt)}
  .sec-head{text-align:center;max-width:960px;margin:0 auto 48px;display:flex;flex-direction:column;gap:16px}
  .sec-head h2{font-family:var(--serif);font-weight:700;font-size:40px;color:var(--text-dark)}
  .sec-head p{font-size:18px;color:var(--text-muted)}

  /* ---------- Feature cards ---------- */
  .card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px;transition:border-color .2s,box-shadow .2s}
  .card:hover{border-color:var(--primary-light);box-shadow:var(--shadow)}
  .card .ico{width:48px;height:48px;border-radius:12px;background:#f5ebe0;display:flex;align-items:center;justify-content:center}
  .card h3{font-size:18px;font-weight:600;color:var(--text-dark)}
  .card p{font-size:14px;color:var(--text-muted)}

  /* ---------- Theme cards ---------- */
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .theme-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
  .theme-card:hover{border-color:var(--primary-light);box-shadow:var(--shadow)}
  .theme-card .swatch{height:130px;display:flex;align-items:flex-end;padding:16px}
  .theme-card .swatch .sample{width:100%;display:flex;flex-direction:column;gap:5px}
  .theme-card .swatch .sample .bar{height:6px;border-radius:2px}
  .theme-card .swatch .sample .bar.title{height:10px;width:40%}
  .theme-card .swatch .sample .bar.body{width:90%}
  .theme-card .swatch .sample .bar.body.short{width:60%}
  .theme-card.dark{background:var(--night-bg);border-color:#43392c}
  .theme-card .meta{padding:20px}
  .theme-card h3{font-size:16px;font-weight:600;color:var(--text-dark);margin-bottom:6px}
  .theme-card.dark h3{color:var(--night-text)}
  .theme-card .meta p{font-size:13px;color:var(--text-muted)}
  .theme-card.dark .meta p{color:var(--night-muted)}
  .theme-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;margin-top:8px}
  .theme-badge.free{background:#e8f0e4;color:var(--accent-green)}
  .theme-badge.pro{background:#f0e7db;color:var(--primary)}

  /* ---------- Privacy ---------- */
  .trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .trust{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px}
  .trust .ico{width:40px;height:40px}
  .trust h3{font-size:16px;font-weight:600;color:var(--text-dark)}
  .trust p{font-size:13px;color:var(--text-muted)}

  /* ---------- Steps ---------- */
  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .step{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
  .step .num{width:48px;height:48px;border-radius:24px;background:#f5ebe0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--primary)}
  .step h3{font-size:20px;font-weight:600;color:var(--text-dark)}
  .step p{font-size:15px;color:var(--text-muted)}

  /* ---------- Pricing ---------- */
  .price-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:840px;margin:0 auto}
  .price-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:36px;display:flex;flex-direction:column;gap:20px;position:relative}
  .price-card.pro{border-color:var(--primary);border-width:2px;box-shadow:var(--shadow)}
  .price-tag{position:absolute;top:-12px;right:24px;background:var(--primary);color:#fff;font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px}
  .price-plan{font-size:18px;font-weight:600;color:var(--text-dark)}
  .price-amount{font-size:42px;font-weight:700;color:var(--text-dark);line-height:1}
  .price-amount .unit{font-size:16px;font-weight:500;color:var(--text-muted)}
  .price-amount .free{color:var(--accent-green)}
  .price-feat{list-style:none;display:flex;flex-direction:column;gap:12px}
  .price-feat li{font-size:14px;color:var(--text-muted);display:flex;align-items:flex-start;gap:8px}
  .price-feat li::before{content:"";width:16px;height:16px;border-radius:50%;background:#e8f0e4;flex-shrink:0;margin-top:2px;background-image:url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z' fill='%235a7a4e'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:center}
  .price-feat li.no::before{background:#f0e7db;background-image:url("data:image/svg+xml,%3Csvg width='10' height='10' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M19 13H5v-2h14v2z' fill='%238b5e3c'/%3E%3C/svg%3E")}
  .price-btn{margin-top:8px;height:48px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:opacity .2s}
  .price-btn.free-btn{background:#f5ebe0;color:var(--primary)}
  .price-btn.pro-btn{background:var(--primary);color:#fff}
  .price-btn:hover{opacity:.9}

  /* ---------- FAQ ---------- */
  .faq-list{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:0}
  .faq-item{border-bottom:1px solid var(--border)}
  .faq-q{width:100%;text-align:left;background:none;border:none;padding:24px 0;font-size:17px;font-weight:600;color:var(--text-dark);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:var(--sans)}
  .faq-q .arrow{width:20px;height:20px;transition:transform .2s;flex-shrink:0;color:var(--primary)}
  .faq-q.open .arrow{transform:rotate(180deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .faq-a.open{max-height:240px}
  .faq-a p{padding:0 0 24px;font-size:15px;color:var(--text-muted);line-height:1.7}

  /* ---------- Download / Browser stores ---------- */
  .download{background:var(--primary);padding:120px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:32px}
  .download h2{font-family:var(--serif);font-weight:700;font-size:40px;color:#fff;max-width:820px}
  .download .dl-sub{font-size:18px;color:#f5ebe0;max-width:640px}
  .browser-badges{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .browser-badge{background:#fff;border-radius:14px;padding:20px 28px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;position:relative;min-width:220px}
  .browser-badge:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.15)}
  .browser-badge .b-logo{width:42px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .browser-badge .b-text{text-align:left}
  .browser-badge .b-label{font-size:11px;color:var(--text-muted);font-weight:500;letter-spacing:.02em}
  .browser-badge .b-name{font-size:18px;font-weight:700;color:var(--text-dark)}
  .browser-badge .b-soon{position:absolute;top:-8px;right:12px;background:var(--accent-green);color:#fff;font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;white-space:nowrap}
  .dl-note{font-size:14px;color:#e8ddd0;max-width:480px}
  .dl-note a{color:#fff;text-decoration:underline;text-underline-offset:3px}

  /* ---------- Footer ---------- */
  footer{background:var(--text-dark);padding:64px 0;display:flex;flex-direction:column;align-items:center;gap:24px}
  .foot-brand{display:flex;align-items:center;gap:12px}
  .foot-brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#b8845a,#8b5e3c);display:flex;align-items:center;justify-content:center}
  .foot-brand .name{font-size:18px;font-weight:600;color:var(--night-text)}
  .foot-links{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}
  .foot-links a{font-size:14px;color:var(--night-muted);transition:color .2s}
  .foot-links a:hover{color:#fff}
  .foot-copy{font-size:13px;color:#8a7d6f;text-align:center}

  /* ---------- Responsive ---------- */
  @media (max-width:1100px){
    .wrap{padding:0 48px}
    .hero h1{font-size:48px}
    .card-grid{grid-template-columns:repeat(2,1fr)}
    .diff-grid,.trust-grid{grid-template-columns:repeat(2,1fr)}
    .diff-item:nth-child(3){border-left:none}
  }
  @media (max-width:680px){
    .wrap{padding:0 24px}
    nav .nav-links a:not(.nav-login){display:none}
    .hero{padding:72px 0}
    .hero h1{font-size:36px}
    .hero .sub{font-size:17px}
    .reader-mock{height:260px}
    .reader-mock .sidebar{width:140px}
    section.block{padding:72px 0}
    .sec-head h2,.download h2,.cta h2{font-size:28px}
    .card-grid,.theme-grid,.steps-grid,.diff-grid,.trust-grid{grid-template-columns:1fr}
    .diff-item + .diff-item{border-left:none;border-top:1px solid var(--border);padding-top:24px}
    .browser-badges{flex-direction:column;align-items:stretch}
    .browser-badge{min-width:auto}
    .price-grid{gap:16px}
    .price-card{padding:24px 18px}
    .price-amount{font-size:32px}
    .price-feat li{font-size:13px}
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="wrap nav-inner">
    <a class="brand" href="#">
      <span class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 40 40" fill="none"><rect x="9" y="8" width="11" height="24" rx="2" fill="#fff"/><rect x="20" y="8" width="11" height="24" rx="2" fill="#fff" opacity=".85"/><rect x="19" y="8" width="2" height="24" fill="#b8845a"/></svg>
      </span>
      <span class="name" data-i18n="brand"></span>
    </a>
    <div class="nav-links">
      <a href="#features" data-i18n="nav.features"></a>
      <a href="#pricing" data-i18n="nav.pricing"></a>
      <a href="https://aura-reader.github.io/login.html" target="_blank" class="nav-login" data-i18n="nav.login"></a>
      <span class="lang-switch">
        <button id="lang-zh" onclick="setLang('zh')">中</button>
        <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
      </span>
    </div>
  </div>
</nav>

<!-- HERO -->
<header class="hero wrap">
  <span class="eyebrow" data-i18n="hero.eyebrow"></span>
  <h1 data-i18n="hero.title"></h1>
  <p class="sub" data-i18n="hero.sub"></p>
  <div class="cta-row">
    <button class="btn-primary" data-i18n="hero.cta1" onclick="document.getElementById('download').scrollIntoView()"></button>
    <button class="btn-ghost" data-i18n="hero.cta2" onclick="document.getElementById('themes').scrollIntoView()"></button>
  </div>
  <div class="reader-mock" aria-hidden="true">
    <div class="sidebar">
      <span class="sb-title">files</span>
      <span class="file a"><span class="dot"></span><span class="lbl"></span></span>
      <span class="file b"><span class="dot"></span><span class="lbl"></span></span>
      <span class="file c"><span class="dot"></span><span class="lbl"></span></span>
    </div>
    <div class="content">
      <span class="h1"></span>
      <span class="p mid"></span>
      <span class="p"></span>
      <span class="p short"></span>
      <span class="quote"><span></span><span class="s"></span></span>
      <span class="code"><span class="ln"></span><span class="ln"></span><span class="ln"></span></span>
    </div>
  </div>
</header>

<!-- DIFF BANNER -->
<section class="diff">
  <div class="wrap diff-grid">
    <div class="diff-item">
      <span class="diff-ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2L4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5l-8-3zm-1 13l-3-3 1.4-1.4L11 12.2l4.6-4.6L17 9l-6 6z" fill="#8b5e3c"/></svg></span>
      <h3 data-i18n="diff1.title"></h3><p data-i18n="diff1.desc"></p>
    </div>
    <div class="diff-item">
      <span class="diff-ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="#8b5e3c"/></svg></span>
      <h3 data-i18n="diff2.title"></h3><p data-i18n="diff2.desc"></p>
    </div>
    <div class="diff-item">
      <span class="diff-ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="#8b5e3c"/></svg></span>
      <h3 data-i18n="diff3.title"></h3><p data-i18n="diff3.desc"></p>
    </div>
    <div class="diff-item">
      <span class="diff-ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h10V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="#8b5e3c"/></svg></span>
      <h3 data-i18n="diff4.title"></h3><p data-i18n="diff4.desc"></p>
    </div>
  </div>
</section>

<!-- FEATURES -->
<section class="block" id="features">
  <div class="wrap">
    <div class="sec-head">
      <h2 data-i18n="feat.title"></h2>
      <p data-i18n="feat.sub"></p>
    </div>

let currentLang = "en";
function setLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    const val = I18N[lang][key];
    if(val!==undefined) el.textContent = val;
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const key = el.getAttribute("data-i18n-html");
    const val = I18N[lang][key];
    if(val!==undefined) el.innerHTML = val;
  });
  document.getElementById("lang-zh").classList.toggle("active", lang==="zh");
  document.getElementById("lang-en").classList.toggle("active", lang==="en");
}
function toggleFaq(btn){
  btn.classList.toggle("open");
  const ans = btn.nextElementSibling;
  ans.classList.toggle("open");
}
setLang(currentLang);
